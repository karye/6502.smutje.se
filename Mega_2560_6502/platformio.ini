; PlatformIO Project Configuration File
;
;   Välj steg i VS Code: PlatformIO-fliken → env:step1 … env:step7
;   Kommandorad: pio run -e step7 -t upload -t monitor
;   Default (megaatmega2560) = steg 7

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = LiquidCrystal
build_flags = -DSTEP8

[env:step1]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -DSTEP1

