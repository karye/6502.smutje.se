; PlatformIO Project Configuration File
;
;   Välj steg i VS Code: PlatformIO-fliken → env:step1 … env:step11
;   Kommandorad: pio run -e step7 -t upload -t monitor
;   Default (default_envs) = steg 9

[platformio]
default_envs = step9

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = LiquidCrystal
build_flags = -DSTEP8
build_src_filter = +<*> -<program_hello.asm>

[env:step1]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -DSTEP1

