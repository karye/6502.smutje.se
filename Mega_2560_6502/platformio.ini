; PlatformIO Project Configuration File
;
;   Välj steg i VS Code: PlatformIO-fliken → env:step1 … env:step7
;   Kommandorad: pio run -e step7 -t upload -t monitor
;   Default (megaatmega2560) = steg 7

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = LiquidCrystal
build_flags = -DSTEP7

[env:step1]
extends = megaatmega2560
build_flags = -DSTEP1

[env:step2]
extends = megaatmega2560
build_flags = -DSTEP2

[env:step3]
extends = megaatmega2560
build_flags = -DSTEP3

[env:step4]
extends = megaatmega2560
build_flags = -DSTEP4

[env:step5]
extends = megaatmega2560
lib_deps = LiquidCrystal
build_flags = -DSTEP5

[env:step6]
extends = megaatmega2560
lib_deps = LiquidCrystal
build_flags = -DSTEP6

[env:step7]
extends = megaatmega2560
build_flags = -DSTEP7
