# ld65-länkskript för steg 12 — fristående dator
# Programmet ligger i EEPROM:en på $C000–$FFFF (övre 16 KB),
# precis som i steg 11. Vektorer på $FFFA.
#
# Binären läggs på EEPROM-adress 0 (= CPU $C000) med vektorer på
# $3FFA (= CPU $FFFA) — redo att brännas med upload_eeprom.py.

MEMORY {
    ZP:    start = $0000, size = $0100, type = rw;  # zero page (SRAM)
    RAM:   start = $0200, size = $7E00, type = rw;  # ledigt RAM (SRAM)
    ROM:   start = $C000, size = $4000, type = ro, file = %O, fill = yes;  # EEPROM
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    CODE:     load = ROM, type = ro;
    VECTORS:  load = ROM, start = $FFFA, type = ro;
}
